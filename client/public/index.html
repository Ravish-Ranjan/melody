<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/logo512.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta
            name="description"
            content="Web site created using create-react-app"
        />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap"
            rel="stylesheet"
        />
        <title>Melody | Home</title>
    </head>
    <body>
        <div id="root"></div>
        <script>
            let path = document.location.pathname;
            if (path === "/") {
                document.title = "Melody | Home";
            } else if (path === "/leaderboard") {
                document.title = "Melody | Leaderboard";
            } else {
                document.title = "Melody | Page Not Found";
            }
        </script>
    </body>
</html>
